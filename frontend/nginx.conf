server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets get a long cache; index.html must not be cached so new
    # deploys are picked up immediately.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html (React Router handles
    # /terms, /privacy, /catalog, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's embedded DNS. Combined with a variable in proxy_pass below, nginx
    # re-resolves the api container at runtime instead of caching its IP at
    # startup — so an api restart (new IP) doesn't leave nginx serving 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse-proxy the API same-origin. The rewrite strips the /api prefix, so
    # /api/auth/login -> api:8000/auth/login.
    location /api/ {
        set $api_upstream api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SQLAdmin panel (and its /admin/statics) use root-relative paths, so it
    # can't live under /api — proxy it at its own root path. Access is gated by
    # is_admin server-side.
    location /admin {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 25m;
}
